
stages:
  - test
  - security
  - approval

python_tests:
  stage: test
  image: python:3.11
  script:
    - python -m pip install --no-cache-dir pytest
    - python -m pytest -v test_risk_engine.py

secret_detection:
  stage: security
  image: python:3.11
  script:
    - python -m pip install --no-cache-dir detect-secrets
    - detect-secrets scan --all-files --exclude-files '(^|/)\.git/' > .secrets.baseline
    - |
      python - <<'PY'
      import json
      import sys

      with open(".secrets.baseline", encoding="utf-8") as file:
          data = json.load(file)

      count = sum(len(items) for items in data["results"].values())
      print(f"Potential secrets detected: {count}")
      sys.exit(1 if count else 0)
      PY

human_approval:
  stage: approval
  image: alpine:3.20
  when: manual
  allow_failure: false
  script:
    - echo "Human approval recorded for release review."
    - echo "No deployment is performed by this job."
