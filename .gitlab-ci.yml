
stages:
  - test
  - security

python_tests:
  stage: test
  image: python:3.11
  script:
    - python -m unittest discover -p "test_*.py" -v

secret_detection:
  stage: security
  image: python:3.11
  script:
    - python -m pip install --no-cache-dir detect-secrets
    - detect-secrets scan --all-files --exclude-files '(^|/)\.git/' --fail-on-unaudited
