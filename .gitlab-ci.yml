
stages:
  - test
  - security

python_tests:
  stage: test
  image: python:3.11
  script:
    - python -m unittest discover -p "test_*.py" -v

secret_detection:
  stage: security
  image: python:3.11
  script:
    - python -m pip install --no-cache-dir detect-secrets
    
        - detect-secrets scan --all-files --exclude-files '(^|/)\.git/' > .secrets.baseline
    - python -c "import json,sys; d=json.load(open('.secrets.baseline')); n=sum(len(v) for v in d['results'].values()); print(f'Secrets detected: {n}'); sys.exit(1 if n else 0)"

